[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kardashev-pi"
version = "1.0.0"
description = "Relativistic Spacetime Consensus & Thermodynamic GCV Settlement Engine (1 Pi = 314,159 TEU)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Kardashev-Pi Working Group", email = "pioneers@kardashev-pi.io"}
]
dependencies = [
    "rich>=13.0.0"
]

[project.scripts]
kardashev-pi = "kardashev_pi.cli.main:main"
